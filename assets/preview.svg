<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Matrix Phosphor theme preview</title>
  <desc id="desc">A synthetic black-first code editor preview using dark, electric, pale-green, and mint-white phosphor tones.</desc>
  <rect width="1200" height="660" rx="24" fill="#000000"/>
  <rect x="24" y="24" width="1152" height="612" rx="16" fill="#010201" stroke="#0e321a" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="54" rx="16" fill="#000000"/>
  <circle cx="58" cy="51" r="8" fill="#356b44"/>
  <circle cx="84" cy="51" r="8" fill="#4c9460"/>
  <circle cx="110" cy="51" r="8" fill="#78f592"/>
  <text x="150" y="59" fill="#78f592" font-family="Cascadia Mono, Consolas, monospace" font-size="20" font-weight="600">MATRIX PHOSPHOR // PREVIEW</text>
  <rect x="24" y="78" width="230" height="558" fill="#010201"/>
  <text x="48" y="118" fill="#4c9460" font-family="Cascadia Mono, Consolas, monospace" font-size="16">EXPLORER</text>
  <text x="48" y="160" fill="#78f592" font-family="Cascadia Mono, Consolas, monospace" font-size="18">⌄ matrix-theme</text>
  <text x="68" y="198" fill="#59d977" font-family="Cascadia Mono, Consolas, monospace" font-size="17">◇ terminal</text>
  <text x="68" y="232" fill="#8bffa4" font-family="Cascadia Mono, Consolas, monospace" font-size="17">◇ vscode</text>
  <text x="68" y="266" fill="#70e58c" font-family="Cascadia Mono, Consolas, monospace" font-size="17">◇ visual-studio</text>
  <text x="68" y="300" fill="#a5c9ac" font-family="Cascadia Mono, Consolas, monospace" font-size="17">◇ ssms</text>
  <text x="68" y="334" fill="#c5d0c7" font-family="Cascadia Mono, Consolas, monospace" font-size="17">◇ notepad++</text>
  <rect x="254" y="78" width="922" height="42" fill="#000000"/>
  <rect x="270" y="88" width="250" height="32" rx="5" fill="#050a06"/>
  <text x="286" y="110" fill="#a7ffb8" font-family="Cascadia Mono, Consolas, monospace" font-size="16">follow-the-green.ps1</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="22">
    <g fill="#356b44" text-anchor="end">
      <text x="300" y="174">1</text><text x="300" y="212">2</text><text x="300" y="250">3</text><text x="300" y="288">4</text><text x="300" y="326">5</text><text x="300" y="364">6</text><text x="300" y="402">7</text><text x="300" y="440">8</text>
    </g>
    <text x="330" y="174" fill="#3a6245"># Wake up. The terminal has you.</text>
    <text x="330" y="212" fill="#63ff82" font-weight="600">function</text>
    <text x="450" y="212" fill="#4de06c">Enter-Matrix</text>
    <text x="610" y="212" fill="#657269"> {</text>
    <text x="370" y="250" fill="#63ff82" font-weight="600">param</text>
    <text x="440" y="250" fill="#657269">([</text>
    <text x="465" y="250" fill="#d1e8d5">bool</text>
    <text x="515" y="250" fill="#657269">]</text>
    <text x="530" y="250" fill="#c0ccc2">$Choice</text>
    <text x="625" y="250" fill="#657269">)</text>
    <text x="370" y="288" fill="#63ff82" font-weight="600">if</text>
    <text x="410" y="288" fill="#c5d0c7"> ($Choice </text>
    <text x="555" y="288" fill="#70a97b">-eq</text>
    <text x="610" y="288" fill="#eff7f0"> $true</text>
    <text x="685" y="288" fill="#657269">) {</text>
    <text x="410" y="326" fill="#4de06c">Write-Host</text>
    <text x="550" y="326" fill="#b7d39a"> 'Follow the green phosphor.'</text>
    <text x="370" y="364" fill="#657269">}</text>
    <text x="330" y="402" fill="#657269">}</text>
    <text x="330" y="440" fill="#4de06c">Enter-Matrix</text>
    <text x="490" y="440" fill="#c0ccc2"> -Choice</text>
    <text x="610" y="440" fill="#eff7f0"> $true</text>
  </g>
  <rect x="254" y="578" width="922" height="58" fill="#020602"/>
  <text x="280" y="614" fill="#c8ffd4" font-family="Cascadia Mono, Consolas, monospace" font-size="18">● Matrix Phosphor</text>
  <text x="1138" y="614" fill="#78f592" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="18">Ln 8, Col 29</text>
</svg>
