name: validate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate and package VS Code theme
        shell: pwsh
        run: ./scripts/Build-Themes.ps1 -SkipVisualStudio

      - name: Build Visual Studio theme
        shell: pwsh
        run: dotnet msbuild ./visual-studio/MatrixPhosphorTheme.csproj /restore /p:Configuration=Release /p:Platform=AnyCPU /p:DeployExtension=false
