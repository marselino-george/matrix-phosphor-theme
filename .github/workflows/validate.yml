name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate public source
        shell: pwsh
        run: ./scripts/Test-PublicRepository.ps1

      - name: Package VS Code theme
        shell: pwsh
        run: ./scripts/Build-Themes.ps1 -SkipVisualStudio

      - name: Build Visual Studio theme
        shell: pwsh
        run: dotnet msbuild ./visual-studio/MatrixPhosphorTheme.csproj /restore /p:Configuration=Release /p:Platform=AnyCPU /p:DeployExtension=false
